name: Backend CI

on:
  push:
    branches: [ main, experiment/astra-simplified ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/vibeledger_test
      DB_SCHEMA: vibeledger_test_runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "ai-ledger-backend/requirements.txt"

      - name: Install Dependencies
        working-directory: ai-ledger-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        working-directory: ai-ledger-backend
        run: |
          python scripts/export_openapi.py --check
          python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Summary
        if: always()
        run: |
          echo "### Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer**: Unit (0 DB, 0 External Network)" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  postgresql-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibeledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibeledger_ci
      DB_SCHEMA: vibeledger_test_ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "ai-ledger-backend/requirements.txt"

      - name: Install Dependencies
        working-directory: ai-ledger-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL Integration Tests
        working-directory: ai-ledger-backend
        run: |
          python -m unittest discover -s tests/integration -p "test_*.py" -v

      - name: Summary
        if: always()
        run: |
          echo "### PostgreSQL Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PostgreSQL Version**: PostgreSQL 17 (Service Container)" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer**: Integration (Database persistence, workflows, constraints)" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  migration-concurrency:
    name: Migration & Concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibeledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibeledger_ci
      DB_SCHEMA: vibeledger_test_ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "ai-ledger-backend/requirements.txt"

      - name: Install Dependencies
        working-directory: ai-ledger-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migration Tests
        working-directory: ai-ledger-backend
        run: |
          python -m unittest discover -s tests/migration -p "test_*.py" -v

      - name: Run Concurrency Tests
        working-directory: ai-ledger-backend
        run: |
          python -m unittest discover -s tests/concurrency -p "test_*.py" -v

      - name: Summary
        if: always()
        run: |
          echo "### Migration & Concurrency Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **PostgreSQL Version**: PostgreSQL 17 (Service Container)" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer**: Migration lifecycle & Multi-connection concurrency" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  dashboard-tests:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "ai-ledger-dashboard/requirements.txt"

      - name: Install Dependencies
        working-directory: ai-ledger-dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dashboard Tests
        working-directory: ai-ledger-dashboard
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Summary
        if: always()
        run: |
          echo "### Dashboard Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer**: Dashboard Unit & Flow Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  container-smoke:
    name: Deployment Container Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build backend target image
        run: docker build -f ai-ledger-backend/Dockerfile -t vibeledger-backend:readiness ai-ledger-backend

      - name: Build Dashboard image
        run: docker build -t vibeledger-dashboard:readiness ai-ledger-dashboard

      - name: Verify built images and container startup
        run: python scripts/container_smoke.py

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: [unit-tests, postgresql-integration, migration-concurrency, dashboard-tests, container-smoke]
    if: ${{ always() }}
    steps:
      - name: Evaluate Required Check Status
        run: |
          echo "Evaluating required backend CI job results:"
          echo "  - Unit Tests: ${{ needs.unit-tests.result }}"
          echo "  - PostgreSQL Integration: ${{ needs.postgresql-integration.result }}"
          echo "  - Migration & Concurrency: ${{ needs.migration-concurrency.result }}"
          echo "  - Deployment Container Smoke: ${{ needs.container-smoke.result }}"
          echo "  - Dashboard Tests: ${{ needs.dashboard-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.postgresql-integration.result }}" != "success" ] || \
             [ "${{ needs.migration-concurrency.result }}" != "success" ] || \
             [ "${{ needs.dashboard-tests.result }}" != "success" ] || \
             [ "${{ needs.container-smoke.result }}" != "success" ]; then
            echo "::error::One or more required CI test jobs failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required Backend CI checks succeeded."

      - name: Aggregated Status Summary
        if: always()
        run: |
          echo "## Backend CI Overall Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PostgreSQL Integration | ${{ needs.postgresql-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration & Concurrency | ${{ needs.migration-concurrency.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard Tests | ${{ needs.dashboard-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Container Smoke | ${{ needs.container-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
