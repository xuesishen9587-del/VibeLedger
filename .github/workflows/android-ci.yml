name: Android CI
on:
  push:
    branches: [main, feature/android-capture-companion]
    paths: ['ai-ledger-android/**', '.github/workflows/android-ci.yml']
  pull_request:
    branches: [main]
    paths: ['ai-ledger-android/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-ledger-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Kotlin unit tests, Android Lint and installable Debug APK
        run: bash ./gradlew --no-daemon :capture-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibeledger-android-debug
          path: ai-ledger-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            ai-ledger-android/capture-core/build/reports/tests/
            ai-ledger-android/app/build/reports/
