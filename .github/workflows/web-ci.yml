name: Web CI
on:
  push:
    branches: [main, experiment/astra-simplified]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vibeledger_test
          POSTGRES_PASSWORD: vibeledger_test_local
          POSTGRES_DB: vibeledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vibeledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ai-ledger-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai-ledger-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ../ai-ledger-backend/requirements.txt
      - name: Browser to real API and PostgreSQL
        run: npm run test:live
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://vibeledger_test:vibeledger_test_local@127.0.0.1:5432/vibeledger_test
          DB_SCHEMA: vibeledger_test_runner
      - name: Build and smoke-test Web container
        run: |
          docker build -t vibeledger-web:test .
          docker run --rm -d --name vibeledger-web-test -p 8080:8080 vibeledger-web:test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/ | grep 'VibeLedger'
          docker stop vibeledger-web-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-results
          path: ai-ledger-web/test-results
